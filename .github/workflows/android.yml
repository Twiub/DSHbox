name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q DSHBox-1.4.0-patched.zip -d src

      - name: Fetch runtime assets from official release
        run: |
          curl -fL --retry 3 -o official.apk \
            https://github.com/WSK-build/DSHBox/releases/download/v1.4.0/dshbox-v1.4.0-release.apk
          mkdir -p official src/runtime/android-assets
          unzip -q official.apk 'assets/dsh/*' 'assets/runtime/*' -d official
          mv official/assets/dsh official/assets/runtime src/runtime/android-assets/
          find src/runtime/android-assets -type f | head
          rm -f official.apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build APK
        working-directory: src/DSHBox-1.4.0
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x test

      - name: Show APKs
        run: find src -name "*.apk" -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: DSHBox-apk
          path: src/DSHBox-1.4.0/app/build/outputs/apk/release/*.apk
