name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q DSHBox-1.4.0-patched.zip -d src
          G=$(find src -name gradlew -type f | head -1)
          [ -n "$G" ] || { echo "gradlew not found in zip"; find src -maxdepth 3 | head -50; exit 1; }
          echo "PROJECT_DIR=$(dirname "$G")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease -x test

      - uses: actions/upload-artifact@v4
        with:
          name: DSHBox-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
