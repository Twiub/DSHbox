name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          G=$(find . -name gradlew -type f | head -1)
          if [ -z "$G" ]; then
            echo "gradlew NOT FOUND. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -80
            exit 1
          fi
          echo "Found: $G"
          echo "PROJECT_DIR=$(dirname "$G")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease -x test

      - uses: actions/upload-artifact@v4
        with:
          name: DSHBox-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
